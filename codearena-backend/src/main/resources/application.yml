spring:
  application:
    name: codearena-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codearena_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  expiration: 86400000