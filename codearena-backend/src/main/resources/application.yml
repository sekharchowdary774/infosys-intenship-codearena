spring:
  application:
    name: codearena-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codearena_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

